<style>
:root{

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);

button{font:inherit;cursor:pointer}
header{background:var(--green);color:white;padding:15px 5%;

.logo{font-family:Georgia,serif;font-size:27px;font-weight:bold}
.logo small{display:block;font:10px Arial;letter-spacing:3px}
nav{display:flex;gap:7px;flex-wrap:wrap}
nav button{background:transparent;color:white;border:1px solid #ffffff70;
 border-radius:25px;padding:7px 14px}
nav button.active,nav button:hover{background:white;color:var(--green)}
main{max-width:1160px;margin:auto;padding:25px 18px 60px}
.hidden{display:none!important}
.hero{background:var(--green);color:white;border-radius:16px;padding:35px;margin-bottom:30px;text-align:center}
.eyebrow{font-size:11px;letter-spacing:3px;color:#d9c7a6;font-weight:bold}
h1{font-size:clamp(29px,5vw,47px);line-height:1.35;margin:10px 0}
h2{font-size:25px;line-height:1.5}
h3{line-height:1.5}
.hero p,.bookhead p{color:#e5e8df;max-width:800px;margin:auto}
.primary,.secondary{border:0;border-radius:12px;padding:12px 24px;font-weight:bold;font-size:16px;box-shadow:0 4px 0 #00000020}
.primary{background:var(--accent);color:white}
.primary:hover{filter:brightness(1.05)}
.secondary{background:#e7dfd1;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.brand-card{background:var(--paper);border:1px solid var(--line);
 border-radius:12px;overflow:hidden;cursor:pointer}
.brand-card:hover{box-shadow:0 7px 20px #00000012;transform:translateY(-2px)}
.brand-cover{height:105px;background:#e7dfd1;color:var(--green);
 display:flex;align-items:center;justify-content:center;text-align:center;
 padding:10px;font-family:Georgia,serif;font-size:23px;font-weight:bold}
.brand-info{padding:14px}
.brand-info h3{margin:0;font-size:18px}
.brand-info p{font-size:13px;color:var(--muted);margin:5px 0 10px}
.pill{background:#e7eee5;color:var(--green);border-radius:20px;

.section-head{margin:25px 0 16px}

.bookhead{background:var(--green);color:white;border-radius:14px;padding:25px;margin:18px 0}

.chapter-nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}

.paper{background:var(--paper);border:1px solid var(--line);
 border-radius:13px;padding:clamp(17px,4vw,35px);min-width:0}
.chapter-number{font-size:11px;letter-spacing:2px;color:var(--orange);font-weight:bold}
.paper h2{border-bottom:2px solid var(--line);padding-bottom:8px}
.paper h3{margin-top:27px}
.paper p{margin:13px 0}
.timeline{border-left:2px solid #c9b99f;margin:22px 0;padding-left:21px}
.era{position:relative;margin:22px 0}
.era:before{content:"";position:absolute;left:-27px;top:12px;width:10px;height:10px;
 background:var(--orange);border-radius:50%}
.era strong{font-size:18px;color:var(--green)}
.note{background:#f1eadc;border-left:4px solid var(--orange);
 padding:13px 16px;margin:20px 0}
.note small{display:block;color:var(--muted)}

 border-radius:8px;display:block}
.image-credit{font-size:11px;color:var(--muted);margin-top:5px}

 gap:22px;padding:22px 0;border-bottom:1px solid var(--line);align-items:start}
.tag-row img{width:100%;height:235px;object-fit:contain;background:#eee8dd;border-radius:8px}

 font-weight:bold;border-radius:5px;padding:3px 9px;font-size:13px}

.checklist li{margin:8px 0}
.source-list a{color:#304c3b;overflow-wrap:anywhere}

 border-radius:13px;padding:25px;margin:auto}
.answers{display:grid;gap:12px;margin:20px 0}

 background:#fffdf8;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
.answer:hover{background:#f5f0e7}
.answer.correct{background:#e4efe2;border-color:#58cc02;color:#2c5e1a}
.answer.wrong{background:#f8e4db;border-color:#b66d45;color:#8a3411}
.progress{height:10px;background:#e5ded2;border-radius:10px;overflow:hidden;margin:15px 0 24px}
.progress div{height:100%;background:var(--accent);transition:width 0.3s}
footer{text-align:center;padding:25px;color:var(--muted);font-size:12px}
@media(max-width:760px){
 header{align-items:flex-start}nav{width:100%}nav button{flex:1}
 main{padding:17px 12px 40px}.hero{padding:23px 18px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .brand-info{padding:10px}.brand-info h3{font-size:16px}
 .model,.tag-row{grid-template-columns:1fr;gap:12px}
 .model img,.tag-row img{height:240px}
 .bookhead{padding:20px}.bookhead h1{font-size:30px}
}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>

async function loadReferenceImages(queries,imgPrefix,creditPrefix){
 await Promise.all(queries.map(async(q,i)=>{
  const img=document.getElementById(imgPrefix+i);
  const credit=document.getElementById(creditPrefix+i);
  if(!q){ setFallbackImage(img, credit); return; }
  try{
   const url="https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="+
   encodeURIComponent(q+" filetype:bitmap")+"&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url&iiurlwidth=800&format=json&origin=*";
   const res=await fetch(url);
   if(!res.ok)throw new Error("request");
   const data=await res.json();
   const pages=Object.values(data.query?.pages||{});
   const chosen=pages.find(p=>p.imageinfo?.[0]?.thumburl||p.imageinfo?.[0]?.url);
   if(!chosen)throw new Error("no image");
   const info=chosen.imageinfo[0];
   img.src=info.thumburl||info.url;
   img.alt=q;
   img.onerror=()=>{setFallbackImage(img, credit);};
   credit.textContent="参考画像（Wikimedia Commons）";
  }catch(e){
   setFallbackImage(img, credit);
  }
 }));
}

function setFallbackImage(img, credit) {
 if(img) {
  img.src = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='200' viewBox='0 0 24 20'%3E%3Cpath fill='%23a39e93' d='M16.5 3c-.4 0-.8.2-1 .5l-1.5 2H10L8.5 3.5C8.3 3.2 7.9 3 7.5 3H4c-.6 0-1 .4-1 1s.4 1 1 1h2.2l2.3 3.1c.3.4.8.6 1.3.6h2.4c.5 0 1-.2 1.3-.6L17.8 5H20c.6 0 1-.4 1-1s-.4-1-1-1h-3.5zM4 8v9c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8H4z'/%3E%3C/svg%3E";
  img.style.objectFit = "contain";
  img.style.padding = "50px";
  img.style.background = "#e7dfd1";
 }
 if(credit) credit.textContent = "画像未設定（手持ちの写真に変更可能）";
}

function uploadCustomImage(event, imgId, creditId) {
 const file = event.target.files[0];
 if(!file)return;
 const reader = new FileReader();
 reader.onload = function(e) {
  const img = document.getElementById(imgId);
  const credit = document.getElementById(creditId);
  img.src = e.target.result;
  img.style.display = "block";
  img.style.padding = "0";
  img.style.background = "#eee8dd";
  if(credit) credit.textContent = "カスタム画像（アップロード済み）";
 };
 reader.readAsDataURL(file);
}

const adaptiveQuestions = [
 {level:1,q:'古着を買う前に、最初に確認する組み合わせとして最も適切なのは？',a:['汚れ・破れ・サイズ感','ブランド名と店の知名度だけ','色落ちの強さと写真の雰囲気だけ','値札とハンガーの種類'],c:0,why:'まずは穴・汚れ・縫い目・ボタンやジッパーの動作と、実寸が自分に合うかを確認します。ブランドが有名でも、状態やサイズが合わなければ満足できないことがあります。'},
 {level:1,q:'古着の「実寸」を確認する理由として最も適切なのは？',a:['表記サイズだけでは実際の寸法が分からないことがあるから','実寸が分かれば製造年代を正確に特定できるから','実寸が大きいほど多くの場合価値が高いから','実寸はブランド名の代わりになるから'],c:0,why:'古着は洗濯や乾燥による縮み、年代やブランドごとのサイズ感の違いがあります。身幅・着丈・肩幅・袖丈などを確認すると、着用時のイメージをつかみやすくなります。'},
 {level:2,q:'ネルシャツの「起毛」とは、一般にどのような加工？',a:['生地表面の繊維をかき出して毛羽立たせる加工','生地に防水フィルムを多くの場合貼る加工','糸を金属で覆って強度を上げる加工','チェック柄を後から刺繍する加工'],c:0,why:'起毛は生地表面を毛羽立たせ、柔らかな風合いや保温性を持たせる加工です。すべてのネルシャツが同じ厚みや素材とは限らないため、実物の生地感も確認しましょう。'},
 {level:2,q:'ワークウェア由来の服を見分ける手がかりとして、最も妥当なのは？',a:['丈夫な生地や補強縫製、実用的なポケット','多くの場合光沢のある薄手生地を使うこと','装飾の多さだけ','多くの場合特定のロゴが胸にあること'],c:0,why:'ワークウェアは作業に耐える耐久性や収納性が重視される傾向があります。ただし年代や用途で仕様は異なるため、ひとつの特徴だけで断定しないことが大切です。'},
 {level:3,q:'Levi’s 501の基本的な前開き仕様として知られるのは？',a:['ボタンフライ','ジッパーフライ中心に','スナップボタン中心に','ベルクロ式'],c:0,why:'501は伝統的にボタンフライが特徴です。一方、同じLevi’sでも505などジッパーフライのモデルがあるため、ブランド名だけでなくモデル番号を確認しましょう。'},
 {level:3,q:'Pendletonの古着で、ブランドの特徴と結びつきが強いアイテムは？',a:['ウールシャツやウールブランケット','ナイロン製の競泳水着','レザーのサッカースパイク','金属製の工具ベルト'],c:0,why:'Pendletonはウール製品、チェック柄のシャツやブランケットで知られます。タグだけでなく、素材表記や生地の質感も合わせて確認すると判断しやすくなります。'},
 {level:4,q:'アウトドア系ジャケットを古着で買うとき、機能面の確認として最も適切なのは？',a:['ジッパー・縫い目・裏地・コーティングの劣化を確認する','ロゴの大きさだけで防水性を判断する','色が濃ければ機能が新品同様と判断する','ブランドの知名度だけで状態を決める'],c:0,why:'アウトドアウェアはジッパーの動作、シームテープ、裏地の剥離、コーティングのべたつきなどが機能に影響します。見た目がきれいでも機能が劣化している場合があります。'},
 {level:4,q:'ミリタリー衣料のコントラクトラベルから読み取れることとして最も近いのは？',a:['契約・納入先・管理番号などの情報','着用者個人のファッションの好み','現在の中古市場での確定価格','洗濯された回数の正確な記録'],c:0,why:'官給品ラベルには契約番号、納入業者、製造時期などの手がかりが記載されることがあります。ラベルの読み方は年代や品目で違うため、複数の情報を照合します。'},
 {level:5,q:'Levi’sの赤タブで「LEVI’S」のEが大文字の通称Big E。オリジナル品の年代を考えるとき、最も妥当なのは？',a:['おおむね1970年以前の手がかりとして、他の仕様も照合する','1970年代後半以降の一般的な赤タブを示す','製造年が書かれた数字としてそのまま読む','復刻品かどうかをタブだけで確定する'],c:0,why:'Levi’s公式の案内では、赤タブの表記は1971年に大文字表記から「Levi’s」へ変更されたとされています。ただし現行の復刻品にもBig Eがあるため、内タグや縫製、パーツなども照合します。'},
 {level:5,q:'Five Brotherのネルシャツを評価するとき、確認ポイントとして最も適切なのは？',a:['生地の厚み・柄・タグ・縫製・ダメージ','チェック柄なら多くの場合古い年代と判断する','タグのロゴだけで価値を確定する','サイズ表記が大きいほど多くの場合高価と判断する'],c:0,why:'Five Brotherはヘビーネルシャツで知られますが、柄やタグだけでは年代・価値を確定できません。生地、縫製、状態、サイズ、同条件の売買例を合わせて確認します。'},

 {level:6,q:'同じブランド・同じモデルの古着でも相場が変わる理由として、最も適切なのは？',a:['年代・サイズ・状態・仕様・需要が異なるため','ブランド名が同じなら価格は多くの場合同じため','色だけで市場価格が一意に決まるため','出品者が設定した価格が多くの場合実売価格になるため'],c:0,why:'同じモデル名でも製造年代や仕様、サイズ、状態、人気によって価格差が出ます。出品中の希望価格と実際に売れた価格も区別して比較しましょう。'},
 {level:6,q:'古着の販売価格を比較するとき、最も条件をそろえた比較はどれ？',a:['同モデル・近い年代・サイズ・状態の売却済み例を複数見る','同じブランドなら別カテゴリの新品と比較する','最高値の出品1件だけを相場とみなす','送料やダメージを無視して表示価格だけを見る'],c:0,why:'モデル、年代、サイズ、状態などの条件が近い売却済み商品を複数比較するのが基本です。送料やリペア歴、付属品の有無も価格差の理由になります。'},
 {level:7,q:'Championの90年代リバースウィーブを見分けるとき、年代の手がかりとして確認したい組み合わせは？',a:['刺繍タグの仕様・生産国表記・縫製ディテール','胸ロゴの仕様を中心に、タグは参考程度にする','ボディカラーと生地の厚さを中心に比較する','出品タイトルと写真の印象を中心に年代を推定する'],c:0,why:'90年代のChampionには刺繍タグやUSA製表記が見られる個体がありますが、仕様はモデルや生産時期で異なります。タグのデザイン、素材表記、縫製、リバースウィーブ特有の脇リブなどを合わせて確認しましょう。'},
 {level:7,q:'「USA製」の表記を見つけたときの判断として最も妥当なのは？',a:['生産背景の手がかりとして、他の仕様や相場も確認する','多くの場合高額なヴィンテージと判断する','表記があれば年代も正確に特定できる','USA製なら多くの場合オリジナル品と断定する'],c:0,why:'製造国は判断材料のひとつですが、価格や年代、オリジナルかどうかを単独で保証しません。タグ、品番、ディテール、状態、取引例を合わせて判断します。'},
 {level:8,q:'Levi’s 501の年代を推定するとき、ボタン裏刻印「3桁」の読み方として最も妥当なのは？',a:['工場コードなどの可能性を考え、タブや内タグなどと照合する','数字を年代の範囲を示す番号として読む','モデル番号の一部として製造時期を絞り込む','数字を主要な根拠として真贋を判断する'],c:0,why:'ボタン裏刻印は工場などを推定する手がかりですが、数字がそのまま製造年を表すわけではありません。赤タブ、パッチ、内タグ、縫製や他のパーツと照合して年代を推定します。'},
 {level:8,q:'ヴィンテージの価格が高い商品を購入する前の対応として最も適切なのは？',a:['型番・ディテール・状態を調べ、信頼できる複数の資料や取引例と照合する','販売タイトルに「激レア」とあれば追加確認しない','高価格なら本物で状態も良いと考える','写真が少ないほど希少性が高いと判断する'],c:0,why:'高額品ほど、商品名や販売者の説明をう中心ににせず、細部の写真、寸法、ダメージ、タグやパーツ、比較可能な実売例を確認することが重要です。'},
 {level:9,q:'同じモデルの売却済みデータが少なく、価格に幅がある場合の判断として最も妥当なのは？',a:['比較対象の少なさと条件差を明示し、幅を持たせて推定する','最も高い1件を確定相場として採用する','出品中の価格をすべて実売価格とみなす','根拠が少なくても一点の価格に断定する'],c:0,why:'比較対象が少ないと推定の不確実性が高まります。近いモデルや年代を補助的に使いつつ、条件の違いを説明し、価格を一点に断定しないのが適切です。'},
 {level:9,q:'リペア済みのヴィンテージ品を相場比較するとき、特に注意する点は？',a:['リペアの位置・方法・品質が価値や着用性に与える影響','リペアがあれば多くの場合価値が上がると考える','リペアの有無は価格に一切関係しないと考える','リペア済みなら製造年代を特定しなくてよいと考える'],c:0,why:'リペアは着用性を高める場合もありますが、オリジナルの状態を重視する市場では評価に影響することがあります。場所、方法、仕上がり、商品の希少性を分けて考えます。'},
 {level:10,q:'あるヴィンテージジャケットについて、タグ表記は年代Aを示すように見える一方、ジッパーと縫製仕様は年代Bの資料に近い。最も適切な対応は？',a:['交換パーツや仕様変更の可能性も考え、複数の根拠を追加確認して結論を保留する','タグだけを優先して年代Aと断定する','ジッパーだけを優先して年代Bと断定する','価格が高ければどちらの年代でも本物と判断する'],c:0,why:'古着には修理によるパーツ交換、年代をまたぐ仕様、復刻品などの可能性があります。矛盾する証拠があるときは一つの特徴を優先して断定せず、追加のディテールや信頼できる資料を探して判断の確度を示します。'},
 {level:10,q:'高額なデニムの年代・真贋・相場を評価するための調査手順として、最も妥当なのは？',a:['モデルと仕様を特定し、年代資料・状態・近い条件の売却済み例を照合して不確実性も記録する','希少という説明と最高値の出品だけを根拠に価格を決める','タグの写真1枚から真贋・年代・価格を同時に確定する','相場が不明なら新品定価をそのまま中古価格にする'],c:0,why:'まずモデルと仕様を確認し、年代を示す複数のディテールを資料と照合します。そのうえで状態やリペアを評価し、条件が近い売却済み例を複数比較します。根拠が不足する部分は断定せず、不確実性を明示するのが上級者の判断です。'}
];

let adaptiveState={n:0,level:1,score:0,seen:[],current:null,peak:1};
function startPlacementTest(){adaptiveState={n:0,level:1,score:0,seen:[],current:null,peak:1};go('placement');renderAdaptiveQuestion();}
function renderAdaptiveQuestion(){
 const box=document.getElementById('placementBox');
 if(adaptiveState.n>=15){showAdaptiveResult();return;}
 const q=diagnosticQuestions[adaptiveState.n];adaptiveState.current=q;
 // 選択肢をシャッフルし、正解位置が固定されないようにする
 const options=q.a.map((text,index)=>({text,correct:index===q.c})).sort(()=>Math.random()-.5);adaptiveState.currentOptions=options;
 box.innerHTML=`<div class="chapter-number">ADAPTIVE TEST · ${adaptiveState.n+1}/15 · LEVEL ${q.level}/10</div><div class="progress"><div style="width:${adaptiveState.n/15*100}%"></div></div><h3>${esc(q.q)}</h3>${q.image?`<img src="${q.image}" alt="${esc(q.imageAlt||'古着の画像')}" style="display:block;width:100%;max-width:520px;max-height:360px;object-fit:contain;margin:16px auto;border-radius:12px;background:#eee"><p class="muted" style="text-align:center">学習用イメージ（実物の販売写真ではありません）</p>`:''}<div class="answers">${options.map((a,i)=>`<button class="answer" onclick="answerAdaptive(${i})">${String.fromCharCode(65+i)}. ${esc(a.text)}</button>`).join('')}</div><p class="muted">正解すると次の難易度が上がり、不正解なら現在のレベル付近で確認します。</p>`;
}
function answerAdaptive(i){const q=adaptiveState.current;if(!q)return;const picked=adaptiveState.currentOptions[i];if(picked?.correct){adaptiveState.score++;adaptiveState.level=Math.min(10,Math.max(adaptiveState.level,q.level)+1);adaptiveState.peak=Math.max(adaptiveState.peak,adaptiveState.level);}else{adaptiveState.level=Math.max(1,Math.min(10,q.level));}adaptiveState.seen.push(q.q);adaptiveState.n++;renderAdaptiveQuestion();}
function showAdaptiveResult(){
 // 正解数と到達難易度の両方を使い、連続正解だけで極端な評価にならないようにする
 const accuracy=adaptiveState.score/15;const level=Math.max(1,Math.min(10,Math.round((adaptiveState.peak*0.7)+(accuracy*4)-0.5)));
 localStorage.setItem('furulearnLevel',String(level));
 const startIndex=level<=2?0:level<=4?2:level<=6?4:level<=8?6:8;
 localStorage.setItem('furulearnStartLesson',String(startIndex));
 const box=document.getElementById('resultBox');box.innerHTML=`<div class="chapter-number">YOUR VINTAGE LEVEL</div><h2>あなたの古着レベルは ${level}/10</h2><p>正解：${adaptiveState.score}/15問 · 到達した難易度：${adaptiveState.peak}/10</p><div class="progress"><div style="width:${level*10}%"></div></div><div class="note"><strong>学習コースのスタート地点</strong><p>${level<=2?'レッスン1：古着の基本から':level<=4?'レッスン3：ブランド・モデルの基礎から':level<=6?'レッスン5：タグと年代判別から':level<=8?'レッスン7：相場・状態評価から':'レッスン9：上級の年代判別と相場分析から'}始めます。レベルが高いほど、基礎を短縮して難しい内容から学べます。</p></div><button class="primary" onclick="go('learn')">診断結果から学習を始める →</button> <button class="secondary" onclick="startPlacementTest()">もう一度診断する</button>`;go('result');
}

 const done=JSON.parse(localStorage.getItem('furulearnDone')||'[]');
 const level=Number(localStorage.getItem('furulearnLevel')||1);const start=Number(localStorage.getItem('furulearnStartLesson')||0);
 document.getElementById('learnPage').innerHTML=`<div class="hero"><div class="eyebrow">YOUR DAILY VINTAGE PATH</div><h1>レベル${level}からの学習コース</h1><p>診断結果に合わせてスタート地点を調整しています。間違えた問題は解説を読んで理解してから次へ進もう。</p><p>クリア済み ${done.length}/${lessons.length} レッスン</p><div class="progress"><div style="width:${done.length/lessons.length*100}%"></div></div></div><div class="path-grid">${lessons.map((l,i)=>`<div class="path-card" style="${i<start?'opacity:.72':''}"><div class="chapter-number">LESSON ${String(i+1).padStart(2,'0')} · LEVEL ${l.level}</div><h3>${esc(l.title)} ${done.includes(i)?'✓':''}</h3><p>${esc(l.desc)}</p>${i<start?'<p class="muted">診断により基礎範囲としてスキップ可能</p>':''}<button class="primary" onclick="openMiniLesson(${i})">${done.includes(i)?'もう一度学ぶ':i===start?'スタート地点から学ぶ':'レッスン開始'}</button></div>`).join('')}</div><div class="feature-panel"><h3>教科書を読む</h3><p>ブランド別の歴史・代表モデル・タグの教科書もそのまま利用できます。</p><button class="secondary" onclick="go('study')">ブランド一覧へ</button></div>`;
}
function openMiniLesson(i){const l=lessons[i];const box=document.getElementById('learnPage');box.innerHTML=`<div class="feature-panel"><button class="secondary" onclick="renderLearningPath()">← 学習コースに戻る</button><div class="chapter-number">QUICK LESSON ${i+1} · LEVEL ${l.level}</div><h2>${esc(l.title)}</h2><p>${esc(l.desc)}</p><h3>${esc(l.q)}</h3><div class="answers">${l.a.map((a,n)=>`<button class="answer" onclick="checkMiniLesson(${i},${n})">${String.fromCharCode(65+n)}. ${esc(a)}</button>`).join('')}</div><div id="miniFeedback"></div></div>`;}
function checkMiniLesson(i,n){const l=lessons[i],f=document.getElementById('miniFeedback');if(n===l.c){let d=JSON.parse(localStorage.getItem('furulearnDone')||'[]');if(!d.includes(i))d.push(i);localStorage.setItem('furulearnDone',JSON.stringify(d));f.innerHTML=`<div class="note"><strong>正解！ +10 XP</strong><p>${esc(l.explain)}</p><button class="primary" onclick="renderLearningPath()">コースに戻る</button></div>`;}else{f.innerHTML=`<div class="note"><strong>不正解。解説を読んで理解しよう</strong><p><strong>正解：</strong>${esc(l.a[l.c])}</p><p>${esc(l.explain)}</p><button class="primary" onclick="openMiniLesson(${i})">もう一度挑戦</button></div>`;}}

function renderPricePage(){document.getElementById('pricePage').innerHTML=`<div class="feature-panel"><div class="chapter-number">VINTAGE PRICE CHECK</div><h2>古着の相場チェック</h2><p>写真をアップロードして、ブランド・アイテム・状態などを入力すると、確認ポイントと参考用の価格帯を表示します。<strong>写真だけで自動鑑定する機能ではありません。</strong></p><h3>写真を撮るときのコツ</h3><ul class="checklist"><li>服全体を正面から撮る</li><li>ブランドタグ・洗濯タグ・品番を撮る</li><li>ダメージ、汚れ、穴、ジッパーを撮る</li><li>デニムはボタン裏、パッチ、ポケット裏なども撮る</li><li>明るい場所でピントを合わせ、影を避ける</li></ul><label>写真を選ぶ<input id="pricePhoto" class="field" type="file" accept="image/*" capture="environment" onchange="previewPricePhoto(event)"></label><img id="pricePreview" alt="アップロードした古着の写真" class="hidden" style="max-width:100%;max-height:340px;border-radius:10px;background:#eee8dd"><label>ブランド・モデル<input id="priceBrand" class="field" placeholder="例：Levi’s 501 / Pendleton wool shirt"></label><label>状態<select id="priceCondition" class="field"><option value="good">目立つダメージなし</option><option value="fair">使用感・小さなダメージあり</option><option value="poor">大きなダメージあり</option><option value="excellent">状態がかなり良い</option></select></label><label>タグ・年代の情報<input id="priceDetails" class="field" placeholder="例：USA製、紙パッチ、タグの表記など"></label><label>アイテム種別<select id="priceType" class="field"><option value="shirt">シャツ</option><option value="denim">デニム・パンツ</option><option value="jacket">ジャケット・アウター</option><option value="sweat">スウェット</option><option value="other">その他</option></select></label><button class="primary" onclick="estimatePrice()">確認ポイントと価格目安を表示</button><div id="priceResult"></div><p class="muted">表示価格は学習用のざっくりした目安です。最新の取引データに接続していないため、実際の相場を保証しません。</p></div>`;}
function previewPricePhoto(e){const f=e.target.files?.[0];if(!f)return;const img=document.getElementById('pricePreview');img.src=URL.createObjectURL(f);img.classList.remove('hidden');}
function estimatePrice(){const brand=document.getElementById('priceBrand').value.trim()||'ブランド未入力';const condition=document.getElementById('priceCondition').value;const type=document.getElementById('priceType').value;const details=document.getElementById('priceDetails').value.trim();let range={shirt:[1500,7000],denim:[2500,12000],jacket:[3000,18000],sweat:[2000,10000],other:[1000,8000]}[type];if(condition==='excellent'){range=[Math.round(range[0]*1.2),Math.round(range[1]*1.25)];}if(condition==='fair'){range=[Math.round(range[0]*.7),Math.round(range[1]*.75)];}if(condition==='poor'){range=[Math.round(range[0]*.35),Math.round(range[1]*.45)];}const fmt=n=>n.toLocaleString('ja-JP');document.getElementById('priceResult').innerHTML=`<div class="note"><h3>確認結果（学習用の仮目安）</h3><p><strong>${esc(brand)}</strong></p><p>参考レンジ：<strong>約${fmt(range[0])}〜${fmt(range[1])}円</strong></p><p>この価格帯は一般的なアイテム分類と状態を使った仮の目安です。ブランド・モデル・年代・サイズ・売れた実例によって大きく変わります。</p><h4>次に確認すること</h4><ul><li>同じモデル・近い状態の「売り切れ」商品を複数比較</li><li>タグ・品番・製造国・ディテールを記録</li><li>穴、汚れ、リペア、縮み、ジッパーの動作を確認</li>${details?`<li>入力したタグ情報：${esc(details)}</li>`:''}</ul><button class="secondary" onclick="go('priceQuiz')">価格当てクイズにも挑戦</button></div>`;}
const priceQuizData=[{q:'古着の相場を調べるとき、いちばん参考になるのは？',a:['同じモデルの売り切れ例を複数見る','値札の色','新品の無関係な商品'],c:0,why:'実際に売れた近い条件の商品を複数比較しよう。'},{q:'同じジャケットなら必ず同じ価格？',a:['状態やサイズ、年代で変わる','必ず同じ','ブランド名だけで決まる'],c:0,why:'状態・サイズ・年代・需要などで価格は変わる。'},{q:'高値がつきやすい要素の例は？',a:['人気モデルで状態が良く需要がある','大きな破れが多い','情報が何も分からない'],c:0,why:'人気と状態、モデルの希少性などが価格に影響する。'},{q:'出品中の価格と実際に売れた価格は？',a:['異なる場合がある','必ず同じ','出品価格は必ず相場より低い'],c:0,why:'売り手の希望価格と成立価格は別。売り切れ例も確認しよう。'}];
let pqIndex=0,pqScore=0;
function renderPriceQuiz(){const box=document.getElementById('priceQuizPage');if(pqIndex>=priceQuizData.length){box.innerHTML=`<div class="quizbox"><h2>価格当てクイズ終了！</h2><p>${pqScore}/${priceQuizData.length}問正解</p><button class="primary" onclick="pqIndex=0;pqScore=0;renderPriceQuiz()">もう一度</button></div>`;return;}const q=priceQuizData[pqIndex];box.innerHTML=`<div class="quizbox"><div class="chapter-number">PRICE QUIZ ${pqIndex+1}/${priceQuizData.length}</div><div class="progress"><div style="width:${pqIndex/priceQuizData.length*100}%"></div></div><h3>${esc(q.q)}</h3><div class="answers">${q.a.map((a,i)=>`<button class="answer" onclick="answerPriceQuiz(${i})">${esc(a)}</button>`).join('')}</div><div id="pqFeedback"></div></div>`;}
function answerPriceQuiz(i){const q=priceQuizData[pqIndex];if(i===q.c)pqScore++;document.getElementById('pqFeedback').innerHTML=`<div class="note"><strong>${i===q.c?'正解！':'おしい！'}</strong><p>${esc(q.why)}</p><button class="primary" onclick="pqIndex++;renderPriceQuiz()">次へ</button></div>`;}
const genreQuestions=[{q:'厚手のネルシャツやペインターパンツと相性が深いジャンルは？',a:['ワーク','フォーマル','ランニング競技'],c:0,why:'作業着由来の丈夫なアイテムがワーク系。'},{q:'M-65やMA-1などのルーツに近いジャンルは？',a:['ミリタリー','プレッピー','サーフ'],c:0,why:'軍用衣料をルーツとするミリタリーウェア。'},{q:'フリースやマウンテンパーカなどが代表的なのは？',a:['アウトドア','ドレス','ワークスーツだけ'],c:0,why:'登山や野外活動向けの機能性が特徴。'},{q:'PendletonやWoolrichで注目したい素材は？',a:['ウール','コンクリート','紙'],c:0,why:'ウール製品やチェックシャツなどが知られる。'},{q:'Five Brotherのイメージに近いアイテムは？',a:['ヘビーネルシャツ','レザーローファー専業','競泳水着'],c:0,why:'厚手のネルシャツで知られるワーク系ブランド。'}];let gqIndex=0,gqScore=0;
function renderGenreQuiz(){const box=document.getElementById('genreQuizPage');if(gqIndex>=genreQuestions.length){box.innerHTML=`<div class="quizbox"><h2>ジャンルクイズ終了！</h2><p>${gqScore}/${genreQuestions.length}問正解</p><button class="primary" onclick="gqIndex=0;gqScore=0;renderGenreQuiz()">もう一度</button><button class="secondary" onclick="go('learn')">学習コースへ</button></div>`;return;}const q=genreQuestions[gqIndex];box.innerHTML=`<div class="quizbox"><div class="chapter-number">GENRE QUIZ ${gqIndex+1}/${genreQuestions.length}</div><h3>${esc(q.q)}</h3><div class="answers">${q.a.map((a,i)=>`<button class="answer" onclick="answerGenreQuiz(${i})">${esc(a)}</button>`).join('')}</div><div id="gqFeedback"></div></div>`;}
function answerGenreQuiz(i){const q=genreQuestions[gqIndex];if(i===q.c)gqScore++;document.getElementById('gqFeedback').innerHTML=`<div class="note"><strong>${i===q.c?'正解！':'もう一度覚えよう'}</strong><p>${esc(q.why)}</p><button class="primary" onclick="gqIndex++;renderGenreQuiz()">次へ</button></div>`;}
// ホームの案内を新機能に合わせて更新
const heroText=document.querySelector('#homePage .hero p');if(heroText)heroText.textContent='適応型診断で古着レベルをチェック。短いレッスン、ジャンルクイズ、相場チェックで少しずつ知識を増やそう。';
const heroButton=document.querySelector('#homePage .hero .primary');if(heroButton){heroButton.textContent='⚡ 15問のレベル診断を始める';heroButton.onclick=startPlacementTest;}
const homeSection=document.createElement('div');homeSection.className='feature-panel';homeSection.innerHTML=`<h2>学習ツール</h2><div class="path-grid"><div class="path-card"><h3>🪜 学習コース</h3><p>短いレッスンで毎日少しずつ学ぶ</p><button class="primary" onclick="go('learn')">学習を始める</button></div><div class="path-card"><h3>📷 相場チェック</h3><p>写真とタグ情報から確認ポイントを整理</p><button class="primary" onclick="go('price')">写真でチェック</button></div><div class="path-card"><h3>🧠 クイズ</h3><p>価格やワーク・ミリタリー・アウトドアを学ぶ</p><button class="secondary" onclick="go('priceQuiz')">価格クイズ</button> <button class="secondary" onclick="go('genreQuiz')">ジャンルクイズ</button></div></div>`;
document.getElementById('homePage').appendChild(homeSection);
// 元のブランド一覧は維持し、追加ブランドも一覧に反映
 document.getElementById('brandGrid').innerHTML=brands.map(makeCard).join('');
 document.getElementById('studyGrid').innerHTML=brands.map(makeCard).join('');
// 初回表示はホームではなく診断テストから開始。診断結果はブラウザ内に保存する。
startPlacementTest();
</script>
